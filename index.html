a<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비트코인 피하기 - 재테크 에디션</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            padding: 20px 10px 100px 10px;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: #1a1a2e;
            border: 4px solid #ffd700;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }
        
        @media (max-width: 820px) {
            body {
                padding: 10px 5px 80px 5px;
            }
            
            #gameContainer {
                height: 70vh;
                min-height: 500px;
                max-height: 600px;
            }
        }
        
        @media (max-width: 480px) {
            #gameContainer {
                height: 60vh;
                min-height: 450px;
            }
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            gap: 10px;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #ffd700;
            flex: 1;
            min-width: 0;
        }
        
        .stat-label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
            word-break: break-all;
        }
        
        @media (max-width: 480px) {
            .stat-box {
                padding: 8px 10px;
            }
            
            .stat-label {
                font-size: 10px;
            }
            
            .stat-value {
                font-size: 14px;
            }
        }
        
        #timer {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 10px;
            border: 2px solid #ffd700;
        }
        
        @media (max-width: 480px) {
            #timer {
                font-size: 22px;
                padding: 6px 15px;
                top: 60px;
            }
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 20;
            border: 3px solid #ffd700;
            max-width: 90%;
            width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            z-index: 20;
            border: 3px solid #ffd700;
            max-width: 90%;
            width: 500px;
        }
        
        #startScreen h1 {
            color: #ffd700;
            font-size: 42px;
            margin-bottom: 20px;
        }
        
        #startScreen .game-info {
            color: #fff;
            font-size: 16px;
            line-height: 1.8;
            margin: 20px 0;
            text-align: left;
        }
        
        #startScreen .game-info div {
            margin: 8px 0;
        }
        
        #startBtn {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 24px;
            background: #ffd700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        #startBtn:hover {
            background: #ffed4e;
            transform: scale(1.1);
        }
        
        @media (max-width: 480px) {
            #startScreen {
                padding: 25px 20px;
            }
            
            #startScreen h1 {
                font-size: 32px;
            }
            
            #startScreen .game-info {
                font-size: 14px;
            }
            
            #startBtn {
                padding: 12px 40px;
                font-size: 20px;
                margin-top: 20px;
            }
        }
        
        @media (max-width: 480px) {
            #gameOver {
                padding: 20px 15px;
                max-width: 95%;
            }
        }
        
        #gameOver h1 {
            color: #ff4757;
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 480px) {
            #gameOver h1 {
                font-size: 28px;
                margin-bottom: 15px;
            }
        }
        
        .final-stats {
            color: #fff;
            margin: 15px 0;
            font-size: 16px;
        }
        
        @media (max-width: 480px) {
            .final-stats {
                font-size: 14px;
                margin: 10px 0;
            }
        }
        
        .final-stat {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
        
        .final-stat strong {
            color: #ffd700;
        }
        
        #leaderboard {
            color: #fff;
            margin-top: 20px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }
        
        #leaderboard h2 {
            color: #ffd700;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .rank {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            font-size: 14px;
            word-break: break-word;
        }
        
        @media (max-width: 480px) {
            .rank {
                padding: 6px;
                font-size: 12px;
            }
        }
        
        .rank.current {
            background: rgba(255,215,0,0.3);
            border: 2px solid #ffd700;
        }
        
        #restartBtn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 20px;
            background: #ffd700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        @media (max-width: 480px) {
            #restartBtn {
                padding: 10px 25px;
                font-size: 18px;
                margin-top: 15px;
            }
        }
        
        #restartBtn:hover {
            background: #ffed4e;
            transform: scale(1.1);
        }
        
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 10px;
            white-space: nowrap;
        }
        
        @media (max-width: 480px) {
            #instructions {
                font-size: 11px;
                padding: 6px 12px;
            }
        }
        
        #controls {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 15;
            padding: 0 10px;
        }
        
        .control-center {
            display: grid;
            grid-template-columns: 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
        }
        
        .control-side {
            position: absolute;
            bottom: 0;
        }
        
        #leftBtn {
            left: 10px;
        }
        
        #rightBtn {
            right: 10px;
        }
        
        @media (max-width: 480px) {
            #controls {
                bottom: 50px;
            }
            
            .control-center {
                grid-template-columns: 50px 50px;
                grid-template-rows: 50px 50px;
                gap: 8px;
            }
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            width: 60px;
            height: 60px;
        }
        
        @media (max-width: 480px) {
            .control-btn {
                font-size: 16px;
                width: 50px;
                height: 50px;
            }
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }
        
        #upBtn {
            grid-column: 2;
            grid-row: 1;
            background: rgba(255, 71, 87, 0.2);
            border: 2px solid rgba(255, 71, 87, 0.4);
            color: #ff4757;
            font-size: 13px;
        }
        
        @media (max-width: 480px) {
            #upBtn {
                font-size: 11px;
            }
        }
        
        #upBtn:hover {
            background: rgba(255, 71, 87, 0.3);
        }
        
        #upBtn:active {
            background: rgba(255, 71, 87, 0.5);
        }
        
        #downBtn {
            grid-column: 2;
            grid-row: 2;
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid rgba(76, 175, 80, 0.4);
            color: #4caf50;
            font-size: 13px;
        }
        
        @media (max-width: 480px) {
            #downBtn {
                font-size: 11px;
            }
        }
        
        #downBtn:hover {
            background: rgba(76, 175, 80, 0.3);
        }
        
        #downBtn:active {
            background: rgba(76, 175, 80, 0.5);
        }
        
        .deposit-animation {
            position: absolute;
            color: #ff4757;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        
        .withdraw-animation {
            position: absolute;
            color: #4caf50;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            to {
                transform: translateY(-50px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <div id="hud">
            <div class="stat-box">
                <div class="stat-label">$ 현금 잔고</div>
                <div class="stat-value" id="cashDisplay">3,000,000원</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">[은행] 누적액</div>
                <div class="stat-value" id="bankDisplay">0원</div>
            </div>
        </div>
        <div id="timer">0.0s</div>
        <div id="startScreen">
            <h1>Bank Lover</h1>
            <div class="game-info">
                <div>💵 시작 자금: 300만원</div>
                <div>🔴 입금(↑): 10만원씩 은행에 입금</div>
                <div>🔵 출금(↓): 10만원씩 은행에서 출금</div>
                <div>🏦 은행 이자: 매초 3% 복리</div>
                <div>🎁 보너스: 60초마다 300만원 지급</div>
                <div>⬅️➡️ 좌우 이동으로 비트코인 피하기</div>
                <div>🏆 순위: 최종 현금 잔고 기준</div>
            </div>
            <button id="startBtn">게임 시작</button>
        </div>
        <div id="controls">
            <button class="control-btn control-side" id="leftBtn">←</button>
            <div class="control-center">
                <button class="control-btn" id="upBtn">입금</button>
                <button class="control-btn" id="downBtn">출금</button>
            </div>
            <button class="control-btn control-side" id="rightBtn">→</button>
        </div>
        <div id="instructions">키보드 방향키 또는 화면 버튼 사용</div>
        <div id="gameOver">
            <h1>게임 오버!</h1>
            <div class="final-stats">
                <div class="final-stat">[시간] 생존 시간: <strong id="finalTime"></strong></div>
                <div class="final-stat">$ 최종 현금 잔고: <strong id="finalCash"></strong></div>
                <div class="final-stat">[은행] 누적액: <strong id="finalBank"></strong></div>
            </div>
            <div id="leaderboard"></div>
            <button id="restartBtn">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let player = {
            x: 0,
            y: 0,
            width: 50,
            height: 50,
            speed: 7,
            currentImage: 'normal',
            animationTimer: 0
        };
        
        // 이미지 로드
        const playerImages = {
            normal: new Image(),
            up: new Image(),
            down: new Image()
        };
        
        // CORS 설정
        playerImages.normal.crossOrigin = "anonymous";
        playerImages.up.crossOrigin = "anonymous";
        playerImages.down.crossOrigin = "anonymous";
        
        let imagesLoaded = 0;
        const totalImages = 3;
        
        playerImages.normal.onload = () => {
            imagesLoaded++;
            console.log('Normal image loaded');
        };
        playerImages.normal.onerror = () => {
            console.error('Failed to load normal image');
        };
        
        playerImages.up.onload = () => {
            imagesLoaded++;
            console.log('Up image loaded');
        };
        playerImages.up.onerror = () => {
            console.error('Failed to load up image');
        };
        
        playerImages.down.onload = () => {
            imagesLoaded++;
            console.log('Down image loaded');
        };
        playerImages.down.onerror = () => {
            console.error('Failed to load down image');
        };
        
        // 이미지 경로 - png 확장자로 변경 (투명 배경 지원)
        playerImages.normal.src = './images/sol.png';
        playerImages.up.src = './images/sol_up.png';
        playerImages.down.src = './images/sol_down.png';
        
        // 캔버스 크기를 컨테이너에 맞게 조정
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // 플레이어를 중앙 하단에 배치
            player.x = (canvas.width / 2) - (player.width / 2);
            player.y = canvas.height - 60;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let cash = 3000000;
        let bank = 0;
        let bitcoins = [];
        let gameStartTime = Date.now();
        let lastInterestTime = Date.now();
        let lastBonusTime = Date.now();
        let gameActive = false;
        let gameStarted = false;
        let keys = {};
        let keysPressed = {};
        let baseSpeed = 2;
        let spawnRate = 1000;
        let lastSpawn = Date.now();
        let scores = JSON.parse(localStorage.getItem('bitcoinScores')) || [];

        // 게임 시작 버튼
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            gameStarted = true;
            gameActive = true;
            gameStartTime = Date.now();
            lastInterestTime = Date.now();
            lastBonusTime = Date.now();
            lastSpawn = Date.now();
        });

        // 컨트롤 버튼 이벤트
        document.getElementById('upBtn').addEventListener('mousedown', () => {
            if (!keysPressed['ArrowUp']) {
                keysPressed['ArrowUp'] = true;
                deposit();
            }
        });
        
        document.getElementById('upBtn').addEventListener('mouseup', () => {
            keysPressed['ArrowUp'] = false;
        });
        
        document.getElementById('downBtn').addEventListener('mousedown', () => {
            if (!keysPressed['ArrowDown']) {
                keysPressed['ArrowDown'] = true;
                withdraw();
            }
        });
        
        document.getElementById('downBtn').addEventListener('mouseup', () => {
            keysPressed['ArrowDown'] = false;
        });
        
        document.getElementById('leftBtn').addEventListener('mousedown', () => {
            keys['ArrowLeft'] = true;
        });
        
        document.getElementById('leftBtn').addEventListener('mouseup', () => {
            keys['ArrowLeft'] = false;
        });
        
        document.getElementById('leftBtn').addEventListener('mouseleave', () => {
            keys['ArrowLeft'] = false;
        });
        
        document.getElementById('rightBtn').addEventListener('mousedown', () => {
            keys['ArrowRight'] = true;
        });
        
        document.getElementById('rightBtn').addEventListener('mouseup', () => {
            keys['ArrowRight'] = false;
        });
        
        document.getElementById('rightBtn').addEventListener('mouseleave', () => {
            keys['ArrowRight'] = false;
        });

        // 터치 이벤트 (모바일 지원)
        document.getElementById('upBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!keysPressed['ArrowUp']) {
                keysPressed['ArrowUp'] = true;
                deposit();
            }
        });
        
        document.getElementById('upBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            keysPressed['ArrowUp'] = false;
        });
        
        document.getElementById('downBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!keysPressed['ArrowDown']) {
                keysPressed['ArrowDown'] = true;
                withdraw();
            }
        });
        
        document.getElementById('downBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            keysPressed['ArrowDown'] = false;
        });
        
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['ArrowLeft'] = true;
        });
        
        document.getElementById('leftBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['ArrowLeft'] = false;
        });
        
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['ArrowRight'] = true;
        });
        
        document.getElementById('rightBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            keys['ArrowRight'] = false;
        });

        // 키보드 이벤트
        document.addEventListener('keydown', (e) => {
            if (!keys[e.key] && !keysPressed[e.key]) {
                keysPressed[e.key] = true;
                
                if (e.key === 'ArrowUp') {
                    deposit();
                } else if (e.key === 'ArrowDown') {
                    withdraw();
                }
            }
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            keysPressed[e.key] = false;
        });

        // 금액 포맷
        function formatMoney(amount) {
            return Math.floor(amount).toLocaleString() + '원';
        }

        // 입금
        function deposit() {
            if (!gameActive) return;
            if (cash >= 100000) {
                cash -= 100000;
                bank += 100000;
                updateDisplay();
                showAnimation('-10만원', player.x + 20, player.y, 'deposit');
                
                // 입금 애니메이션
                player.currentImage = 'up';
                player.animationTimer = 300; // 0.3초 후 원래 자세로
            }
        }

        // 출금
        function withdraw() {
            if (!gameActive) return;
            if (bank >= 100000) {
                bank -= 100000;
                cash += 100000;
                updateDisplay();
                showAnimation('+10만원', player.x + 20, player.y, 'withdraw');
                
                // 출금 애니메이션
                player.currentImage = 'down';
                player.animationTimer = 300; // 0.3초 후 원래 자세로
            }
        }

        // 이자 계산 (1초마다 3%)
        function calculateInterest() {
            if (!gameActive || bank === 0) return;
            
            const now = Date.now();
            if (now - lastInterestTime >= 1000) {
                const interest = bank * 0.03;
                bank += interest;
                updateDisplay();
                lastInterestTime = now;
            }
        }

        // 60초마다 보너스 지급
        function checkBonus() {
            if (!gameActive) return;
            
            const now = Date.now();
            if (now - lastBonusTime >= 60000) {
                cash += 3000000;
                updateDisplay();
                showAnimation('+300만원 보너스!', canvas.width / 2 - 50, canvas.height / 2, 'deposit');
                lastBonusTime = now;
            }
        }

        // 애니메이션 표시
        function showAnimation(text, x, y, type) {
            const div = document.createElement('div');
            div.className = type === 'deposit' ? 'deposit-animation' : 'withdraw-animation';
            div.textContent = text;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            document.getElementById('gameContainer').appendChild(div);
            
            setTimeout(() => div.remove(), 1000);
        }

        // 디스플레이 업데이트
        function updateDisplay() {
            document.getElementById('cashDisplay').textContent = formatMoney(cash);
            document.getElementById('bankDisplay').textContent = formatMoney(bank);
        }

        // 비트코인 생성
        function spawnBitcoin() {
            const elapsedTime = (Date.now() - gameStartTime) / 1000;
            const currentSpeed = baseSpeed + elapsedTime * 0.1;
            
            bitcoins.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                width: 30,
                height: 30,
                speed: currentSpeed
            });
        }

        // 플레이어 그리기
        function drawPlayer() {
            // 애니메이션 타이머 업데이트
            if (player.animationTimer > 0) {
                player.animationTimer -= 16; // 약 60fps 기준
                if (player.animationTimer <= 0) {
                    player.currentImage = 'normal';
                }
            }
            
            // 현재 이미지 그리기
            const currentImg = playerImages[player.currentImage];
            if (currentImg && currentImg.complete && currentImg.naturalWidth > 0) {
                ctx.drawImage(currentImg, player.x, player.y, player.width, player.height);
            } else {
                // 이미지 로딩 중이거나 실패했을 때 기본 도형 표시
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                
                // 텍스트 표시
                ctx.fillStyle = '#000000';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('SOL', player.x + player.width/2, player.y + player.height/2 + 4);
            }
        }

        // 비트코인 그리기
        function drawBitcoin(bitcoin) {
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.arc(bitcoin.x + 15, bitcoin.y + 15, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('₿', bitcoin.x + 15, bitcoin.y + 20);
        }

        // 충돌 감지
        function checkCollision(bitcoin) {
            return player.x < bitcoin.x + bitcoin.width &&
                   player.x + player.width > bitcoin.x &&
                   player.y < bitcoin.y + bitcoin.height &&
                   player.y + player.height > bitcoin.y;
        }

        // 타이머 업데이트
        function updateTimer() {
            if (gameActive) {
                const elapsed = ((Date.now() - gameStartTime) / 1000).toFixed(1);
                document.getElementById('timer').textContent = elapsed + 's';
            }
        }

        // 순위 표시 (잔고 기준, 3위까지만)
        function showLeaderboard(currentScore) {
            scores.push(currentScore);
            scores.sort((a, b) => b.cash - a.cash);
            scores = scores.slice(0, 3); // 3위까지만 저장
            localStorage.setItem('bitcoinScores', JSON.stringify(scores));

            const leaderboardDiv = document.getElementById('leaderboard');
            leaderboardDiv.innerHTML = '<h2>*** 순위 (잔고 기준) ***</h2>';
            
            scores.forEach((score, index) => {
                const rankDiv = document.createElement('div');
                rankDiv.className = 'rank';
                if (score === currentScore) {
                    rankDiv.className += ' current';
                }
                rankDiv.innerHTML = `${index + 1}위: <strong>${formatMoney(score.cash)}</strong> (생존: ${score.time}초, 은행: ${formatMoney(score.bank)})`;
                leaderboardDiv.appendChild(rankDiv);
            });
        }

        // 게임 오버
        function gameOver() {
            gameActive = false;
            const finalTime = ((Date.now() - gameStartTime) / 1000).toFixed(1);
            
            document.getElementById('finalTime').textContent = finalTime + '초';
            document.getElementById('finalCash').textContent = formatMoney(cash);
            document.getElementById('finalBank').textContent = formatMoney(bank);
            
            showLeaderboard({
                time: parseFloat(finalTime),
                cash: cash,
                bank: bank
            });
            
            document.getElementById('gameOver').style.display = 'block';
        }

        // 게임 루프
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 게임이 시작되지 않았으면 플레이어만 그리기
            if (!gameStarted) {
                drawPlayer();
                requestAnimationFrame(gameLoop);
                return;
            }

            if (!gameActive) {
                // 게임이 비활성화되어도 마지막 프레임은 그리기
                drawPlayer();
                return;
            }

            // 플레이어 이동
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // 비트코인 생성
            const elapsedTime = (Date.now() - gameStartTime) / 1000;
            const currentSpawnRate = Math.max(300, spawnRate - elapsedTime * 20);
            
            if (Date.now() - lastSpawn > currentSpawnRate) {
                spawnBitcoin();
                lastSpawn = Date.now();
            }

            // 비트코인 업데이트
            for (let i = bitcoins.length - 1; i >= 0; i--) {
                bitcoins[i].y += bitcoins[i].speed;
                drawBitcoin(bitcoins[i]);

                // 충돌 체크
                if (checkCollision(bitcoins[i])) {
                    gameOver();
                    return;
                }

                // 화면 밖으로 나간 비트코인 제거
                if (bitcoins[i].y > canvas.height) {
                    bitcoins.splice(i, 1);
                }
            }

            drawPlayer();
            updateTimer();
            calculateInterest();
            checkBonus();
            requestAnimationFrame(gameLoop);
        }

        // 재시작
        document.getElementById('restartBtn').addEventListener('click', () => {
            // 게임 오버 화면 숨기기
            document.getElementById('gameOver').style.display = 'none';
            
            // 모든 변수 초기화
            bitcoins = [];
            cash = 3000000;
            bank = 0;
            gameStartTime = Date.now();
            lastInterestTime = Date.now();
            lastBonusTime = Date.now();
            lastSpawn = Date.now();
            keysPressed = {};
            
            // 플레이어 위치 초기화
            player.x = (canvas.width / 2) - (player.width / 2);
            player.y = canvas.height - 60;
            player.currentImage = 'normal';
            player.animationTimer = 0;
            
            // 게임 상태 활성화
            gameActive = true;
            gameStarted = true;
            
            // 디스플레이 업데이트
            updateDisplay();
            
            // 게임 루프가 멈춰있을 수 있으므로 다시 시작
            gameLoop();
        });

        // 게임 시작
        updateDisplay();
        gameLoop();
    </script>
</body>
</html>
