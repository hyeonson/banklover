<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비트코인 피하기 - 재테크 에디션</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: #1a1a2e;
            border: 4px solid #ffd700;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }
        
        .stat-box {
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #ffd700;
        }
        
        .stat-label {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
        }
        
        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 10px 30px;
            border-radius: 10px;
            border: 2px solid #ffd700;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 20;
            border: 3px solid #ffd700;
            max-width: 600px;
        }
        
        #gameOver h1 {
            color: #ff4757;
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .final-stats {
            color: #fff;
            margin: 20px 0;
            font-size: 20px;
        }
        
        .final-stat {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
        
        .final-stat strong {
            color: #ffd700;
        }
        
        #leaderboard {
            color: #fff;
            margin-top: 20px;
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
        }
        
        #leaderboard h2 {
            color: #ffd700;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .rank {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            font-size: 16px;
        }
        
        .rank.current {
            background: rgba(255,215,0,0.3);
            border: 2px solid #ffd700;
        }
        
        #restartBtn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            background: #ffd700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        #restartBtn:hover {
            background: #ffed4e;
            transform: scale(1.1);
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        .deposit-animation {
            position: absolute;
            color: #4caf50;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        
        .withdraw-animation {
            position: absolute;
            color: #ff4757;
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            to {
                transform: translateY(-50px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <div id="hud">
            <div class="stat-box">
                <div class="stat-label">💰 현금 잔고</div>
                <div class="stat-value" id="cashDisplay">3,000,000원</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🏦 은행 누적액</div>
                <div class="stat-value" id="bankDisplay">0원</div>
            </div>
        </div>
        <div id="timer">0.0s</div>
        <div id="instructions">← → 이동 | ↑ 입금(10만원) | ↓ 출금(10만원)</div>
        <div id="gameOver">
            <h1>게임 오버!</h1>
            <div class="final-stats">
                <div class="final-stat">⏱️ 생존 시간: <strong id="finalTime"></strong></div>
                <div class="final-stat">💰 최종 현금 잔고: <strong id="finalCash"></strong></div>
                <div class="final-stat">🏦 은행 누적액: <strong id="finalBank"></strong></div>
            </div>
            <div id="leaderboard"></div>
            <button id="restartBtn">다시 시작</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        let player = {
            x: 400,
            y: 550,
            width: 40,
            height: 40,
            speed: 7
        };

        let cash = 3000000;
        let bank = 0;
        let bitcoins = [];
        let gameStartTime = Date.now();
        let lastInterestTime = Date.now();
        let lastBonusTime = Date.now();
        let gameActive = true;
        let keys = {};
        let keysPressed = {};
        let baseSpeed = 2;
        let spawnRate = 1000;
        let lastSpawn = Date.now();
        let scores = JSON.parse(localStorage.getItem('bitcoinScores')) || [];

        // 키보드 이벤트
        document.addEventListener('keydown', (e) => {
            if (!keys[e.key] && !keysPressed[e.key]) {
                keysPressed[e.key] = true;
                
                if (e.key === 'ArrowUp') {
                    deposit();
                } else if (e.key === 'ArrowDown') {
                    withdraw();
                }
            }
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            keysPressed[e.key] = false;
        });

        // 금액 포맷
        function formatMoney(amount) {
            return Math.floor(amount).toLocaleString() + '원';
        }

        // 입금
        function deposit() {
            if (!gameActive) return;
            if (cash >= 100000) {
                cash -= 100000;
                bank += 100000;
                updateDisplay();
                showAnimation('+10만원', player.x + 20, player.y, 'deposit');
            }
        }

        // 출금
        function withdraw() {
            if (!gameActive) return;
            if (bank >= 100000) {
                bank -= 100000;
                cash += 100000;
                updateDisplay();
                showAnimation('-10만원', player.x + 20, player.y, 'withdraw');
            }
        }

        // 이자 계산 (1초마다 3%)
        function calculateInterest() {
            if (!gameActive || bank === 0) return;
            
            const now = Date.now();
            if (now - lastInterestTime >= 1000) {
                const interest = bank * 0.03;
                bank += interest;
                updateDisplay();
                lastInterestTime = now;
            }
        }

        // 60초마다 보너스 지급
        function checkBonus() {
            if (!gameActive) return;
            
            const now = Date.now();
            if (now - lastBonusTime >= 60000) {
                cash += 3000000;
                updateDisplay();
                showAnimation('+300만원 보너스!', canvas.width / 2 - 50, canvas.height / 2, 'deposit');
                lastBonusTime = now;
            }
        }

        // 애니메이션 표시
        function showAnimation(text, x, y, type) {
            const div = document.createElement('div');
            div.className = type === 'deposit' ? 'deposit-animation' : 'withdraw-animation';
            div.textContent = text;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            document.getElementById('gameContainer').appendChild(div);
            
            setTimeout(() => div.remove(), 1000);
        }

        // 디스플레이 업데이트
        function updateDisplay() {
            document.getElementById('cashDisplay').textContent = formatMoney(cash);
            document.getElementById('bankDisplay').textContent = formatMoney(bank);
        }

        // 비트코인 생성
        function spawnBitcoin() {
            const elapsedTime = (Date.now() - gameStartTime) / 1000;
            const currentSpeed = baseSpeed + elapsedTime * 0.1;
            
            bitcoins.push({
                x: Math.random() * (canvas.width - 30),
                y: -30,
                width: 30,
                height: 30,
                speed: currentSpeed
            });
        }

        // 플레이어 그리기
        function drawPlayer() {
            ctx.fillStyle = '#3498db';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x + 10, player.y + 10, 20, 20);
        }

        // 비트코인 그리기
        function drawBitcoin(bitcoin) {
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.arc(bitcoin.x + 15, bitcoin.y + 15, 15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('₿', bitcoin.x + 15, bitcoin.y + 20);
        }

        // 충돌 감지
        function checkCollision(bitcoin) {
            return player.x < bitcoin.x + bitcoin.width &&
                   player.x + player.width > bitcoin.x &&
                   player.y < bitcoin.y + bitcoin.height &&
                   player.y + player.height > bitcoin.y;
        }

        // 타이머 업데이트
        function updateTimer() {
            if (gameActive) {
                const elapsed = ((Date.now() - gameStartTime) / 1000).toFixed(1);
                document.getElementById('timer').textContent = elapsed + 's';
            }
        }

        // 순위 표시 (잔고 기준)
        function showLeaderboard(currentScore) {
            scores.push(currentScore);
            scores.sort((a, b) => b.cash - a.cash);
            scores = scores.slice(0, 10);
            localStorage.setItem('bitcoinScores', JSON.stringify(scores));

            const leaderboardDiv = document.getElementById('leaderboard');
            leaderboardDiv.innerHTML = '<h2>🏆 순위 (잔고 기준) 🏆</h2>';
            
            scores.forEach((score, index) => {
                const rankDiv = document.createElement('div');
                rankDiv.className = 'rank';
                if (score === currentScore) {
                    rankDiv.className += ' current';
                }
                rankDiv.innerHTML = `${index + 1}위: <strong>${formatMoney(score.cash)}</strong> (생존: ${score.time}초, 은행: ${formatMoney(score.bank)})`;
                leaderboardDiv.appendChild(rankDiv);
            });
        }

        // 게임 오버
        function gameOver() {
            gameActive = false;
            const finalTime = ((Date.now() - gameStartTime) / 1000).toFixed(1);
            
            document.getElementById('finalTime').textContent = finalTime + '초';
            document.getElementById('finalCash').textContent = formatMoney(cash);
            document.getElementById('finalBank').textContent = formatMoney(bank);
            
            showLeaderboard({
                time: parseFloat(finalTime),
                cash: cash,
                bank: bank
            });
            
            document.getElementById('gameOver').style.display = 'block';
        }

        // 게임 루프
        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 플레이어 이동
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }

            // 비트코인 생성
            const elapsedTime = (Date.now() - gameStartTime) / 1000;
            const currentSpawnRate = Math.max(300, spawnRate - elapsedTime * 20);
            
            if (Date.now() - lastSpawn > currentSpawnRate) {
                spawnBitcoin();
                lastSpawn = Date.now();
            }

            // 비트코인 업데이트
            for (let i = bitcoins.length - 1; i >= 0; i--) {
                bitcoins[i].y += bitcoins[i].speed;
                drawBitcoin(bitcoins[i]);

                // 충돌 체크
                if (checkCollision(bitcoins[i])) {
                    gameOver();
                    return;
                }

                // 화면 밖으로 나간 비트코인 제거
                if (bitcoins[i].y > canvas.height) {
                    bitcoins.splice(i, 1);
                }
            }

            drawPlayer();
            updateTimer();
            calculateInterest();
            checkBonus();
            requestAnimationFrame(gameLoop);
        }

        // 재시작
        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOver').style.display = 'none';
            bitcoins = [];
            player.x = 400;
            cash = 3000000;
            bank = 0;
            gameStartTime = Date.now();
            lastInterestTime = Date.now();
            lastBonusTime = Date.now();
            gameActive = true;
            lastSpawn = Date.now();
            keysPressed = {};
            updateDisplay();
            gameLoop();
        });

        // 게임 시작
        updateDisplay();
        gameLoop();
    </script>
</body>
</html>
